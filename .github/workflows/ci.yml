name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-test:
    name: Rust Test (${{ matrix.os }}, ${{ matrix.crypto }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            crypto: crypto-ring
            cargo_args: ""
          - os: macos-latest
            crypto: crypto-aws-lc
            cargo_args: "--no-default-features --features crypto-aws-lc"
          - os: windows-latest
            crypto: crypto-ring
            cargo_args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            lumen-core/target
          key: ${{ matrix.os }}-cargo-${{ matrix.crypto }}-${{ hashFiles('lumen-core/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-${{ matrix.crypto }}-

      - name: Run tests
        working-directory: lumen-core
        run: cargo test --all ${{ matrix.cargo_args }}

  swift-build:
    name: Swift build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS app
        run: swift build --package-path Lumen
